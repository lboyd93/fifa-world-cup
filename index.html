<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>FIFA World Cup</title>
    <link rel="icon" href="./resources/soccer_ball2.svg" />

    <!-- Load Calcite components from CDN -->
    <script
      type="module"
      src="https://js.arcgis.com/calcite-components/3.3.0/calcite.esm.js"
    ></script>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script src="https://js.arcgis.com/4.34/"></script>

    <!-- Load Map components from CDN -->
    <script
      type="module"
      src="https://js.arcgis.com/4.34/map-components/"
    ></script>

    <link rel="stylesheet" type="text/css" href="src/main.css" />
  </head>

  <body>
    <arcgis-map center="-29.35265, 14.75494" zoom="3">
      <arcgis-popup slot="popup" dock-enabled></arcgis-popup>
      <arcgis-legend slot="bottom-left"></arcgis-legend>
	  <arcgis-search slot="bottom-right" all-placeholder="Find country or stadium" include-default-sources-disabled ></arcgis-search>
    </arcgis-map>
	<script type="module" src="src/main.js"></script>
  </body>
</html>
